<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title></title>
</head>
<body>
    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}



    <form method="post">
        {% csrf_token %}

        <p>
            Հեռախոսահամար։<br>
            <input type="tel" name="phone" required>
        </p>
        
        <p>
            Գաղտնաբառ։<br>
            <input type="password" name="password" required>
        </p>
        
        <p>
            Գաղտնաբառ։<br>
            <input type="password" name="password2" required>
        </p>

        <input type="submit" value="Register">
    </form>
    <p>Արդեն ունե՞ք հաշիվ: <a href="{% url 'login' %}">Մուտք գործել</a></p>
</body>
</html>
