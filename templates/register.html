<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title></title>
</head>
<body>
    <h2>Գրանցում</h2>
    {% if error %}<p style="color: red;">{{ error }}</p>{% endif %}
    <form method="POST">
        {% csrf_token %}
        <input type="text" name="phone_number" placeholder="Հեռախոսահամար (օր.՝ 37499112233)" required><br><br>
        <input type="password" name="password" placeholder="Գաղտնաբառ" required><br><br>
        <input type="text" name="telegram_chat_id" placeholder="Telegram Chat ID" required>
        <button type="submit">Գրանցվել</button>
    </form>
    <p>Արդեն ունե՞ք հաշիվ: <a href="{% url 'login' %}">Մուտք գործել</a></p>
</body>
</html>
