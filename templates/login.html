<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <h2>Մուտք</h2>
    {% if error %}<p style="color: red;">{{ error }}</p>{% endif %}
    <form method="POST">
        {% csrf_token %}
        <input type="text" name="phone" placeholder="Հեռախոսահամար" required><br><br>
        <input type="password" name="password" placeholder="Գաղտնաբառ" required><br><br>
        <button type="submit">Մուտք</button>
    </form>
     | <a href="{% url 'register' %}">Գրանցվել</a>
</body>
</html>
