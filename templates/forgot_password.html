<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <h2>Վերականգնել Գաղտնաբառը</h2>
    <p>Գրեք ձեր հեռախոսահամարը, և մենք կուղարկենք հաստատման կոդը WhatsApp-ով։</p>
    {% if error %}<p style="color: red;">{{ error }}</p>{% endif %}
    <form method="POST">
        {% csrf_token %}
        <input type="text" name="phone_number" placeholder="Հեռախոսահամար" required><br><br>
        <button type="submit">Ուղարկել Կոդը</button>
    </form>
</body>
</html>
