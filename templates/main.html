<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <title>Supermarket</title>

    <style>
        .products {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .product_container {
            width: 200px;
            min-height: 280px;
            border: 2px solid green;
            padding: 10px;
        }

        .prod_image {
            width: 150px;
            height: 150px;
            object-fit: contain;
        }

        .product_name {
            font-size: 18px;
            font-weight: bold;
        }

        .price {
            font-size: 18px;
            color: green;
        }

        .add_button {
            padding: 8px 15px;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

{% if customer.is_authenticated %}
    <p>Բարի գալուստ, {{ customer.phone }}</p>

    <a href="{% url 'logout' %}">Logout</a>
{% endif %}

<a href="{% url 'cart' %}">
    🛒 Զամբյուղ
</a>

<h1>Ապրանքներ</h1>

<div class="products">

    {% for product in products %}

    <div class="product_container" id="{{ product.id }}">

        {% if product.image %}
            <img
                src="{{ product.image.url }}"
                class="prod_image"
            >
        {% endif %}

        <h3>{{ product }}</h3>

        <p>{{ product.price }} ֏</p>

        <form
            method="POST"
            action="{% url 'add_to_cart' product.id %}"
        >
            {% csrf_token %}

            <button type="submit">
                🛒 Add to cart
            </button>
        </form>

    </div>

    {% endfor %}

</div>

</body>
</html>
