<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <style>
        .product_container{
            width: 100px;
            height: 180px;
            border: 2px solid green;
        }
        .prod_image{
            width: 30px;
            height: 30px;
        }


    </style>
</head>
<body>

    {% if request.session.customer_phone %}
        <p>Բարի գալուստ, {{ request.session.customer_phone }}</p>
        <a href="{% url 'logout' %}">Logout</a>
    {% else %}
        <a href="{% url 'login' %}">Login</a> | <a href="{% url 'register' %}">Register</a>
    {% endif %}


    {% for cat in category %}

        <p>{{ cat.name_hy }}</p>

    {% endfor %}


</body>
</html>
