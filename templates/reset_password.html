<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <h2>Նոր Գաղտնաբառ</h2>
    <p>Մուտքագրեք ձեր WhatsApp-ին ստացված 6-նիշանոց կոդը և նոր գաղտնաբառը։</p>
    {% if error %}<p style="color: red;">{{ error }}</p>{% endif %}
    <form method="POST">
        {% csrf_token %}
        <input type="text" name="otp" placeholder="6-նիշանոց կոդ" required><br><br>
        <input type="password" name="new_password" placeholder="Նոր Գաղտնաբառ" required><br><br>
        <button type="submit">Փոխել Գաղտնաբառը</button>
</form>
</body>
</html>
